<!DOCTYPE html>
<html lang="ko">

<head>
    <style>
        body {
            background-color: rgba(235, 192, 131, 0.6);
            color: #130301;
            text-align: center;
        }

        #input {
            /*#중요!!*/
            background-color: rgb(189, 235, 203);
            border-radius: 1rem;
            /* 모서리 둥글게 */
            box-shadow: 0 0.4rem 0.5rem;
            /* 은은한 그림자 */
            padding-bottom: 15px;
        }

        #outcome {
            background-color: rgb(201, 233, 207);
            border-radius: 1rem;
            box-shadow: 0 0.4rem 0.5rem;


        }

        button[type=button],
        button[type=reset] {
            background-color: #06f311;
            color: rgb(13, 13, 13);
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            /*
            cursor: pointer;
            커서를 손가락 모양으로 만들어줌
            필요 없어서 제거
            */
            box-shadow: 0 0.4rem 0.5rem;
            /* 은은한 그림자 */
            border-radius: 1rem;
            /* 모서리 둥글게 */
        }



        label {
            padding-inline: 10px;
            /*padding-left: 10px; + padding-right: 10px;과 동일*/

            display: inline-block;
            width: 80px;
            /*라벨은 인라인 테그임!!>>>> display: inline-block;를 같이 써줘야함*/
            background-color: #f0f0f3;
            text-align: center;



        }

        input:hover {
            box-sizing: border-box;
            /*font-family: inherit;이걸 쓰면 input의 박스가 커짐*/
            background-color: rgb(112, 228, 145);

        }


        button[type=button]:hover,
        button[type=reset]:hover {
            background-color: #2528eb;
            transition: all 0.2s;
        }

        button:hover {
            font-family: inherit;
            background-color: aqua;
        }

        h2 {
            background-color: green;
            border-radius: 1rem;
            /* 모서리 둥글게 */
        }



        button {
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.2s;
        }

        table {
            margin: 0 auto;
            /*0:위라애 의 마진을 0으로 두겠다는 의미, auto: 양옆의 중앙을 자동으로 나누겠다*/
        }

        table th,
        table tr {
            background-color: white;
        }
    </style>
    <script>
        let datalist = [
            {
                id: 1,
                name: "오도리코",
                singer: "바운디",
                produser: "바운디",
                genre: "j_pop"
            },
            {
                id: 2,
                name: "괴수의 꽃노래",
                singer: "바운디",
                produser: "바운디",
                genre: "j_pop"
            },
            {
                id: 3,
                name: "airis out",
                singer: "요네즈 켄시",
                produser: "요네즈켄시",
                genre: "j_pop"
            }
        ]; window.addEventListener("load", function () {
            const name = document.querySelector("#name")
            const singer = document.querySelector("#singer")
            const produser = document.querySelector("#produser")
            const genre = document.querySelector("#genre")
            const add = document.querySelector("#btn1")
            const reset = document.querySelector("#btn2")

            let newdata = null;

            let count = 4;

            for (let i = 0; i < datalist.length; i++) {
                const tr = document.createElement("tr");
                for (let j = 0; j < Object.values(datalist[i]).length; j++) {
                    const td1 = document.createElement("td");          // ← 여기로 이동
                    td1.textContent = Object.values(datalist[i])[j];
                    tr.appendChild(td1);

                }

                //수정버튼과 삭제버튼 추가

                //수정버튼
                const btn1 = document.createElement("button")
                const P = document.createElement("td")
                btn1.textContent = "수정";
                P.appendChild(btn1);
                tr.appendChild(P)
                btn1.addEventListener("click", edit);

                //삭제버튼
                const btn2 = document.createElement("button");
                const Q = document.createElement("td")
                btn2.textContent = "삭제";
                Q.appendChild(btn2);
                tr.appendChild(Q)
                btn2.addEventListener("click", remove);
                table.appendChild(tr);
            }

            function render() {
                const detanum = table.querySelectorAll("tr");/*한마디로 테이블의 모든 tr을 대상한다는 의미임,datanum에는 테이블의 tr이 들어감 자동으로 처음 tr을 0으로 간주함*/
                for (let i = 1; i < detanum.length; i++) {
                    detanum[i].children[0].textContent = i;
                }
                count = detanum.length;
            }

            function remove(e) {
                if (confirm("삭제하시겠습니까?")) {
                    const a = e.target.parentElement.parentElement;
                    //if(a.children[0] == 1){}
                    e.target.parentElement.parentElement.remove();
                    render()

                }


            }
            function edit(e) {//젤 어려움
                const a = e.target.parentElement.parentElement;
                //에딧에서는 datalist를 쓰면 안됨>>datalist는 사용할떄마다 갱신되어 마지막에 남는것만 기억함!!
                newdata = a;
                name.value = a.children[1].textContent;
                singer.value = a.children[2].textContent;
                produser.value = a.children[3].textContent;
                genre.value = a.children[4].textContent;


            }


            add.addEventListener("click", function () {
                //validation
                if (name.value.trim() === "") {

                    alert("가수를 입력하세요.");

                    name.focus();
                    return;
                }

                else if (singer.value.trim() === "") {

                    alert("가수를 입력하세요.");

                    singer.focus();
                    return;
                }

                else if (produser.value.trim() === "") {

                    alert("작곡가를 입력하세요.");

                    produser.focus();
                    return;
                }

                else if (genre.value.trim() === "") {

                    alert("장르를 입력하세요.");

                    genre.focus();
                    return;
                }

                if (newdata == null) {//수정으로 들어온게 아니라면
                    //새로운 '칸'만들기
                    const tr = document.createElement("tr");
                    const td1 = document.createElement("td")//.createElement("td")의tr은 html에서 쓰는 테그임!!>>내가 지정한거 쓰면 안됨ex)t1(X)
                    const td2 = document.createElement("td");
                    const td3 = document.createElement("td");
                    const td4 = document.createElement("td");
                    const td5 = document.createElement("td");
                    const td6 = document.createElement("td");
                    const td7 = document.createElement("td");

                    //데이터를 넣음

                    const item = {
                        id: count,
                        name: name.value,
                        singer: singer.value,
                        produser: produser.value,
                        genre: genre.value
                    };
                    datalist.push(item);


                    td1.textContent = item.id
                    td2.textContent = item.name
                    td3.textContent = item.singer
                    td4.textContent = item.produser
                    td5.textContent = item.genre
                    count++;


                    tr.appendChild(td1);
                    tr.appendChild(td2);
                    tr.appendChild(td3);
                    tr.appendChild(td4);
                    tr.appendChild(td5);
                    table.appendChild(tr);

                    //수정버튼 추가
                    const btn1 = document.createElement("button");
                    btn1.textContent = "수정";
                    td6.appendChild(btn1);
                    tr.appendChild(td6);
                    btn1.addEventListener("click", edit);

                    //삭제버튼 추가
                    const btn2 = document.createElement("button");//버튼 앞에 #붙이면 안
                    btn2.textContent = "삭제";
                    td7.appendChild(btn2);
                    tr.appendChild(td7);
                    btn2.addEventListener("click", remove);
                    //내가 넣은 값을 없애주기
                    name.value = null;
                    singer.value = null;
                    produser.value = null;
                    genre.value = null;

                }
                else {
                    newdata.children[1].textContent = name.value;//a.children[1].textContent가 안되는 이유>>a는 edit이라는 함수에서만 쓰이는 지역함수이기 대문제 edit밖에서는 아무 쓸모가 없음
                    newdata.children[2].textContent = singer.value;
                    newdata.children[3].textContent = produser.value;
                    newdata.children[4].textContent = genre.value;
                    newdata = null
                    //내가 넣은 값을 없애주기
                    name.value = null;
                    singer.value = null;
                    produser.value = null;
                    genre.value = null;
                }
            })
        });

    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>좋아하는 음악 리스트</title>

<body>
    <header>
        <h1>내가 좋아하는 음악 리스트</h1>

    </header>
    <main>
        <div id="input">
            <form>
                <h2>song_table</h2>
                <label for="name"> 제목 </label>
                <input type="text" id="name"><br>


                <label for="singer"> 가수 </label>
                <input type="text" id="singer"><br>

                <label for="produser"> 작곡가</label>
                <input type="text" id="produser"><br>

                <label for="genre"> 장르</label>
                <input type="text" id="genre"> <br>

                <br>
                <button id="btn1" type="button">추가/수정</button>
                <button id="btn2" type="reset">리셋</button>
            </form>

        </div>








        <div id="outcome">
            <h2>내용</h2>
            <table id="table">
                <tr>
                    <th>번호</th>
                    <th>제목</th>
                    <th>가수</th>
                    <th>작곡가</th>
                    <th>장르</th>
                </tr>
                <!--
                <tr>
                    <th>1</th>
                    <th>오도리코</th>
                    <th>바운디</th>
                    <th>바운디</th>
                    <th>j_pop</th>
                    <th><button id=bt3>수정 </button></th>
                    <th><button id=bt1>삭제 </button></th>
                </tr>
                <tr>
                    <th>2</th>
                    <th>괴수의 꽃노래</th>
                    <th>바운디</th>
                    <th>바운디</th>
                    <th>j_pop</th>
                    <th><button id=bt4>수정 </button></th>
                    <th><button id=bt2>삭제 </button></th>
                <tr>
                    <th>3</th>
                    <th>airis out</th>
                    <th>요네즈 켄시</th>
                    <th>요네즈켄시</th>
                    <th>j_pop</th>
                    <th><button id=nbtn1>수정 </button></th>
                    <th><button id=nbtn2>삭제 </button></th>
                    -->
                </tr>
            </table>
        </div>
    </main>
</body>

</html>
