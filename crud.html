<!DOCTYPE html>
<html lang="ko">

<head>
    <script>


        window.addEventListener("load", function () {
            function remove(e) {
                e.target.parentElement.parentElement.remove();
                count--;

            }
            function edit(e) {//젤 어려움
                const a = e.target.parentElement.parentElement;//쓰임을 아직 잘 모르겠음
                //에딧에서는 datalist를 쓰면 안됨>>datalist는 사용할떄마다 갱신되어 마지막에 남는것만 기억함!!
                let newdata = []
                newdata[1] = a.children[1].textContent;
                newdata[2] = a.children[2].textContent;
                newdata[3] = a.children[3].textContent;
                newdata[4] = a.children[4].textContent;

                name.value = newdata[1];
                singer.value = newdata[2];
                produser.value = newdata[3];
                genre.value = newdata[4];
            }
            const name = document.querySelector("#name")
            const singer = document.querySelector("#singer")
            const produser = document.querySelector("#produser")
            const genre = document.querySelector("#genre")
            const add = document.querySelector("#btn1")
            const reset = document.querySelector("#btn2")
            
            //디폴트 테이블의 삭제버튼
            const bt1 = document.querySelector("#bt1")
            const bt2 = document.querySelector("#bt2")

            //디폴트 테이블의 수정버튼
            const bt3 = document.querySelector("#bt3")
            const bt4 = document.querySelector("#bt4")

            const table = document.querySelector("#table")

            const id = 1

            const datalist = [id, name, singer, produser, genre]
            //const datalist = {"id","제목","가수","작곡가","장르"}>>오류 중괄호 쓰면 됨!!오직 대괄호!!
            bt1.addEventListener("click", remove);
            bt2.addEventListener("click", remove);

            bt3.addEventListener("click", edit);
            bt4.addEventListener("click", edit);

            let count = 2; //변경될거여서 let을 써야함(자주 까먹음)
            //대괄호를 쓰면 표에서 NaN뜸>>>>> 자바스크립트에서는 Number[0]을 숫자로 인식하지 않음.
            //애초에 변수 선언시 Number()을 안 써도 됨!!

            add.addEventListener("click", function () {
                const tr = document.createElement("tr");
                const td1 = document.createElement("td")//.createElement("td")의tr은 html에서 쓰는 테그임!!>>내가 지정한거 쓰면 안됨ex)t1(X)
                const td2 = document.createElement("td");
                const td3 = document.createElement("td");
                const td4 = document.createElement("td");
                const td5 = document.createElement("td");
                const td6 = document.createElement("td");
                const td7 = document.createElement("td");
                count++;
                datalist[0] = count;
                datalist[1] = name.value;
                datalist[2] = singer.value;
                datalist[3] = produser.value;
                datalist[4] = genre.value;

                td1.textContent = datalist[0];
                td2.textContent = datalist[1];
                td3.textContent = datalist[2];
                td4.textContent = datalist[3];
                td5.textContent = datalist[4];



                tr.appendChild(td1);
                tr.appendChild(td2);
                tr.appendChild(td3);
                tr.appendChild(td4);
                tr.appendChild(td5);
                table.appendChild(tr);
                const btn1 = document.createElement("button");
                btn1.textContent = "수정";
                td6.appendChild(btn1);//굳이 t6를 다시 만듦!!
                tr.appendChild(td6);
                btn1.addEventListener("click", edit);

                const btn2 = document.createElement("button");//버튼 앞에 #붙이면 안
                btn2.textContent = "삭제";
                td7.appendChild(btn2);//굳이 t7를 다시 만듦!!
                tr.appendChild(td7);
                btn2.addEventListener("click", remove);
            })
        });

    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>좋아하는 음악 리스트</title>

<body>
    <div>
        <header>
            <h1>내가 좋아하는 음악 리스트</h1>

        </header>
        <main>
            <form>
                <h2>song_table</h2><!--줄을 맞추고 싶은데-->
                <label for=""> 제목 </label>
                <input type="text" id="name"><br>


                <label for=""> 가수 </label>
                <input type="text" id="singer"><br>

                <label for=""> 작곡가</label><!--줄을 맞추고 싶은데-->
                <input type="text" id="produser"><br>

                <label for=""> 장르</label>
                <input type="text" id="genre"> <br>

                <br>
                <button id="btn1" type="button">내 음악 추가</button>
                <button id="btn2" type="reset">리셋</button>
            </form>


            -------------------------------------------








            <table id="table">
                <thead>
                    <tr>
                        <th>번호</th>
                        <th>제목</th>
                        <th>가수</th>
                        <th>작곡가</th>
                        <th>장르</th>
                    </tr>
                    <tr>
                        <th>1</th>
                        <th>a</th>
                        <th>b</th>
                        <th>c</th>
                        <th>d</th>
                        <th><button id=bt3>수정 </button></th>
                        <th><button id=bt1>삭제 </button></th>
                    </tr>
                    <tr>
                        <th>2</th>
                        <th>ㄱ</th>
                        <th>ㄴ</th>
                        <th>ㄷ</th>
                        <th>ㄹ</th>
                        <th><button id=bt4>수정 </button></th>
                        <th><button id=bt2>삭제 </button></th><!--.parentElement를 한번만 사용하면 boutton만 삭제됨-->
                    </tr>

            </table>
        </main>
        <footer>
        </footer>
    </div>

</body>

</html>

</body>

</html>
